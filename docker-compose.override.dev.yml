services:
  caddy:
    volumes:
      - ./webserver/Caddyfile.dev:/etc/caddy/Caddyfile
  rss_temple_migrate:
    image: rss_temple
    command: python ./manage.py migrate
    build:
      context: ./
    environment:
      APP_IN_DOCKER: 'true'
      # jemalloc configuration. See https://github.com/jemalloc/jemalloc/blob/dev/TUNING.md
      MALLOC_CONF: background_thread:true,max_background_threads:1,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000
    volumes:
      - ./:/code/
  rss_temple_collectstatic:
    image: rss_temple
    command: python ./manage.py collectstatic --noinput
    build:
      context: ./
    environment:
      APP_IN_DOCKER: 'true'
      # jemalloc configuration. See https://github.com/jemalloc/jemalloc/blob/dev/TUNING.md
      MALLOC_CONF: background_thread:true,max_background_threads:1,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000
    volumes:
      - ./:/code/
  rss_temple:
    image: rss_temple
    command: >
      gunicorn
      --reload
      -b 0.0.0.0:8000
      --worker-class gthread
      --workers 4
      --threads 2
      rss_temple.wsgi:application
    build:
      context: ./
    environment:
      APP_IN_DOCKER: 'true'
      # jemalloc configuration. See https://github.com/jemalloc/jemalloc/blob/dev/TUNING.md
      MALLOC_CONF: background_thread:true,max_background_threads:1,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000
    expose:
      - '8000'
    volumes:
      - ./:/code/
  rss_temple_dramatiq:
    image: rss_temple
    command: >
      dramatiq
      api_dramatiq.main
      -Q rss_temple
      --watch /code/
      --watch-include '*.py'
    build:
      context: ./
    environment:
      APP_IN_DOCKER: 'true'
      # jemalloc configuration. See https://github.com/jemalloc/jemalloc/blob/dev/TUNING.md
      MALLOC_CONF: background_thread:true,max_background_threads:1,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000
    volumes:
      - ./:/code/
  rss_temple_schedulerdaemon:
    image: rss_temple
    command: >
      sh -c "
        python ./manage.py checkclassifierlabels

        exec watchmedo auto-restart \\
          --directory=/code/ \\
          --pattern=*.py \\
          --ignore-patterns=**/.venv/* \\
          --recursive -- \\
          python ./manage.py schedulerdaemon /code/schedulerdaemon.json
      "
    build:
      context: ./
    environment:
      APP_IN_DOCKER: 'true'
      # jemalloc configuration. See https://github.com/jemalloc/jemalloc/blob/dev/TUNING.md
      MALLOC_CONF: background_thread:true,max_background_threads:1,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000
    volumes:
      - ./:/code/
