services:
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data/
    networks:
      - rss_temple_net
    healthcheck:
      test: ['CMD-SHELL', '[ "$$(valkey-cli ping)" = PONG ]']
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
  postgresql:
    image: postgres:18-alpine
    shm_size: '256m'
    expose:
      - '5432'
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/
    networks:
      - rss_temple_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"']
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s
  caddy:
    image: caddy:2-alpine
    ports:
      - '8000:8000'
    volumes:
      - caddy_data:/data/
      - django_static:/static/
    networks:
      - default
      - rss_temple_net
  # One-shot: applies migrations, then exits. The long-running services wait for it to finish successfully
  rss_temple_migrate:
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - rss_temple_net
  # One-shot: copies static files into the volume Caddy serves, then exits
  rss_temple_collectstatic:
    env_file:
      - .env
    volumes:
      - django_static:/code/_static/
    networks:
      - rss_temple_net
  rss_temple:
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rss_temple_migrate:
        condition: service_completed_successfully
      rss_temple_collectstatic:
        condition: service_completed_successfully
    networks:
      - default  # necessary, because functionality requires making calls to the external internet
      - rss_temple_net
  rss_temple_dramatiq:
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rss_temple_migrate:
        condition: service_completed_successfully
    networks:
      - default  # necessary, because functionality requires making calls to the external internet
      - rss_temple_net
  rss_temple_schedulerdaemon:
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rss_temple_migrate:
        condition: service_completed_successfully
    networks:
      - rss_temple_net
volumes:
  db_data:
  caddy_data:
  valkey_data:
  django_static:
networks:
  rss_temple_net:
    internal: true
